[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-data-pipeline"
version = "0.1.0"
description = "Batch medallion pipeline: CSV to Delta Lake to star schema, orchestrated by Airflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deltalake[s3]>=0.18",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
warehouse = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
